name: Build
'on':
  pull_request:
  push:
    branches:
    - "**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Check out source
      uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - name: Prepare ShenYu core API artifacts
      shell: bash
      run: |
        CORE_API_DIR="${RUNNER_TEMP}/shenyu-core-api"
        git init "${CORE_API_DIR}"
        git -C "${CORE_API_DIR}" remote add origin https://github.com/cloudbase-ai/shenyu.git
        git -C "${CORE_API_DIR}" fetch --depth 1 origin dd498378d91a019403a5b8c1c4c0d348f85cb4fb
        git -C "${CORE_API_DIR}" checkout --detach FETCH_HEAD
        "${CORE_API_DIR}/mvnw" -B -ntp -f "${CORE_API_DIR}/pom.xml" -pl shenyu-plugin/shenyu-plugin-logging/shenyu-plugin-logging-common,shenyu-web,shenyu-admin-listener/shenyu-admin-listener-api,shenyu-registry/shenyu-registry-api,shenyu-plugin/shenyu-plugin-global,shenyu-plugin/shenyu-plugin-proxy/shenyu-plugin-divide,shenyu-plugin/shenyu-plugin-uri,shenyu-plugin/shenyu-plugin-httpclient,shenyu-plugin/shenyu-plugin-response -am install -DskipTests -Dmaven.javadoc.skip=true -Drat.skip=true -Djacoco.skip=true -DskipRemoteResources=true
    - name: Prepare original-suite core APIs
      run: |
        CORE_API_DIR="${RUNNER_TEMP}/shenyu-core-api"
        "${CORE_API_DIR}/mvnw" -B -ntp -f "${CORE_API_DIR}/pom.xml" -pl shenyu-admin,shenyu-kubernetes-controller,shenyu-spring-boot-starter/shenyu-spring-boot-starter-k8s,shenyu-spring-boot-starter/shenyu-spring-boot-starter-client/shenyu-spring-boot-starter-client-common -am install -DskipTests -Dmaven.javadoc.skip=true -Drat.skip=true -Djacoco.skip=true -DskipRemoteResources=true
        "${CORE_API_DIR}/mvnw" -B -ntp -f "${CORE_API_DIR}/pom.xml" -pl shenyu-spring-boot-starter/shenyu-spring-boot-starter-plugin/shenyu-spring-boot-starter-plugin-httpclient,shenyu-spring-boot-starter/shenyu-spring-boot-starter-plugin/shenyu-spring-boot-starter-plugin-global,shenyu-spring-boot-starter/shenyu-spring-boot-starter-plugin/shenyu-spring-boot-starter-plugin-uri,shenyu-spring-boot-starter/shenyu-spring-boot-starter-plugin/shenyu-spring-boot-starter-plugin-general-context -am install -DskipTests -Dmaven.javadoc.skip=true -Drat.skip=true -Djacoco.skip=true -DskipRemoteResources=true
        "${CORE_API_DIR}/mvnw" -B -ntp -f "${CORE_API_DIR}/shenyu-examples/pom.xml" -pl shenyu-examples-common -am install -DskipTests -Dmaven.javadoc.skip=true -Drat.skip=true -Djacoco.skip=true
        mvn -B -ntp dependency:get -Dartifact=com.h2database:h2:1.4.200
    - name: Prepare inherited SOFA core APIs
      run: |
        CORE_API_DIR="${RUNNER_TEMP}/shenyu-core-api"
        "${CORE_API_DIR}/mvnw" -B -ntp -f "${CORE_API_DIR}/pom.xml" -pl shenyu-spring-boot-starter/shenyu-spring-boot-starter-plugin/shenyu-spring-boot-starter-plugin-jwt -am install -DskipTests -Dmaven.javadoc.skip=true -Drat.skip=true -Djacoco.skip=true -DskipRemoteResources=true
        bash script/plugin-store/prepare-core-artifacts.sh "${CORE_API_DIR}"
    - name: Build, test, check style, and verify licenses
      run: mvn -B -ntp clean verify -Dapi.version=1.44
    - name: Compile preserved original test and example assets
      run: mvn -B -ntp -Pintegration-tests,e2e,examples test-compile -DskipTests -Dapi.version=1.44
    - name: Verify store-owned SQL installation
      run: |
        for plugin in motan sofa tars hystrix logging-aliyun-sls logging-clickhouse casdoor logging-tencent-cls logging-huawei-lts logging-pulsar logging-rabbitmq; do
          python3 script/plugin-store/build-h2-store-sql-fixture.py "${plugin}" --core-source "${RUNNER_TEMP}/shenyu-core-api" --execute --verify-conflicts --verify-custom-config --require-row-manifest
        done
    - name: Verify Motan against the cutover core API
      run: mvn -B -ntp -pl shenyu-plugin/shenyu-plugin-proxy/shenyu-plugin-motan,shenyu-spring-boot-starter-plugin/shenyu-spring-boot-starter-plugin-motan
        -am verify -Dshenyu.version=2.7.2-SNAPSHOT -Dapi.version=1.44
    - name: Run preserved Motan integration and E2E scenarios
      env:
        SHENYU_CORE_SOURCE: "${{ runner.temp }}/shenyu-core-api"
      run: bash script/plugin-store/run-motan-original-suites.sh all
    - name: Verify inherited SOFA and TARS SQL
      run: |
        for plugin in sofa tars; do
          python3 script/plugin-store/build-h2-store-sql-fixture.py "${plugin}" --core-source "${RUNNER_TEMP}/shenyu-core-api" --execute --verify-conflicts --verify-custom-config --require-row-manifest
        done
    - name: Run inherited SOFA integration and E2E scenarios
      env:
        SHENYU_CORE_SOURCE: "${{ runner.temp }}/shenyu-core-api"
      run: bash script/plugin-store/run-sofa-original-suites.sh
    - name: Verify shared original-suite support
      run: mvn -B -ntp -Pintegration-tests,e2e -pl shenyu-integrated-test/shenyu-plugin-store-it-common,shenyu-e2e/shenyu-plugin-store-e2e-common
        -am verify -Dapi.version=1.44
    - name: Run preserved SOFA integration and E2E scenarios
      env:
        SHENYU_CORE_SOURCE: "${{ runner.temp }}/shenyu-core-api"
      run: bash script/plugin-store/run-sofa-original-suites.sh
    - name: Run preserved Hystrix integration scenarios
      env:
        SHENYU_CORE_SOURCE: "${{ runner.temp }}/shenyu-core-api"
        STORE_PLUGIN_CLASS: org.apache.shenyu.plugin.hystrix.HystrixPlugin
        STORE_PLUGIN_MAVEN_ARGS: "-Dhystrix-core.version=1.5.18 -Dhystrix-metrics-event-stream.version=1.5.18
          -Drxjava-reactive-streams.version=1.2.1"
        CASE_MAVEN_ARGS: "-Dhystrix-core.version=1.5.18 -Dhystrix-metrics-event-stream.version=1.5.18
          -Drxjava-reactive-streams.version=1.2.1"
      run: |
        bash script/plugin-store/build-store-plugin-jars.sh hystrix
        bash script/plugin-store/run-original-it.sh hystrix shenyu-integrated-test/shenyu-integrated-test-http-hystrix
    - name: Run preserved Pulsar integration scenarios
      env:
        SHENYU_CORE_SOURCE: "${{ runner.temp }}/shenyu-core-api"
      run: bash script/plugin-store/run-broker-original-suites.sh logging-pulsar it
    - name: Run preserved RabbitMQ integration and E2E scenarios
      env:
        SHENYU_CORE_SOURCE: "${{ runner.temp }}/shenyu-core-api"
      run: bash script/plugin-store/run-broker-original-suites.sh logging-rabbitmq
        all
