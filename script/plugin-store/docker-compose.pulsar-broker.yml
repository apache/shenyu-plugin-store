services:
  shenyu-pulsar:
    image: ${PULSAR_IMAGE:-apachepulsar/pulsar:2.10.1}
    container_name: ${COMPOSE_PROJECT_NAME:-shenyu-store-suite}-broker
    command: bin/pulsar standalone
    ports:
      - "${PULSAR_PORT:-6650}:6650"
      - "${PULSAR_HTTP_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bin/pulsar-admin brokers healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30

  shenyu-bootstrap:
    depends_on:
      - shenyu-admin
      - plugin-store-backend
      - shenyu-pulsar
