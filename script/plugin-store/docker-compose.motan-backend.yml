services:
  shenyu-zk:
    image: zookeeper:3.9
    ports:
      - "${STORE_ZK_PORT:-31083}:2181"
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status >/dev/null 2>&1"]
      timeout: 2s
      retries: 30
      start_period: 5s

  shenyu-admin:
    depends_on:
      - shenyu-zk
    volumes:
      - ${STORE_ADMIN_JARS_DIR:?STORE_ADMIN_JARS_DIR is required}:/opt/shenyu-admin/ext-lib:ro

  plugin-store-backend:
    image: ${STORE_HTTP_BACKEND_IMAGE:-shenyu-examples-motan:latest}
    entrypoint: []
    command:
      - sh
      - -c
      - "sleep ${STORE_MOTAN_BACKEND_DELAY_SECONDS:-10}; java --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/sun.net.util=ALL-UNNAMED -jar shenyu-examples-motan.jar"
    depends_on:
      shenyu-zk:
        condition: service_healthy
      shenyu-admin:
        condition: service_started
    environment:
      motan.registry.protocol: zookeeper
      motan.registry.address: ${STORE_MOTAN_REGISTRY_ADDRESS:-shenyu-zk:2181}
      motan.registry.connectTimeout: ${STORE_MOTAN_REGISTRY_CONNECT_TIMEOUT:-10000}
      shenyu.register.serverLists: http://shenyu-admin:9095
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep UP || exit 1"]
      timeout: 2s
      retries: 30
      start_period: 5s
    ports:
      - "${STORE_BACKEND_HTTP_PORT:-31081}:8081"
      - "${STORE_BACKEND_MOTAN_PORT:-31082}:8002"
